name: Workspace checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_challenge:
        description: 'Also run acceptance tests (expected red until the exercise is completed)'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install and verify the starter
        run: npm run setup
      - name: Upload generated dependency lockfile
        uses: actions/upload-artifact@v4
        with:
          name: dependency-lockfile
          path: package-lock.json
      - name: Challenge acceptance tests
        if: ${{ inputs.run_challenge == true }}
        run: npm run test:challenge
